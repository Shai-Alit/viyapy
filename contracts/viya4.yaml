# Declared REST footprint viyapy depends on for SAS Viya 4.
#
# scripts/check_api_drift.py asserts the Viya4Dialect and the recorded fixtures
# still match this contract. If SAS changes an endpoint or response shape, update
# this file together with the dialect code and the tests/fixtures/viya4 payloads
# — the checker fails if they diverge.
generation: viya4
dialect: Viya4Dialect
fixtures: viya4
reference: https://developer.sas.com/rest-apis
model_step_type: application/vnd.sas.decision.step.model

endpoints:
  - id: get_decision_content
    method: GET
    path: /decisions/flows/{decision_id}
    accept: application/vnd.sas.decision+json
    # Fields the client reads off the decision payload (dotted = nested).
    response_fields: [name, flow.steps]

  - id: execute_mas_step
    method: POST
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    request_fields: [inputs]
    # Binary inputs/outputs: an input or output object may carry `encoding: "b64"`
    # with a base64 string value (MAS accepts this for `binary`/`any`-typed vars).
    # Correlation metadata is optional: a sibling `metadata` object on the request
    # with snake_case `client_id`/`transaction_id`, which MAS echoes on the
    # response `metadata` (alongside server-added `module_id`/`step_id`). Both are
    # optional, so they stay out of the checked `request_fields` (build_inputs
    # omits them unless supplied).
    # Optional `waitTime` query param (milliseconds) selects the execution mode:
    # omitted = synchronous (executionState `completed`); positive = timed
    # (`completed` or `timedOut`); 0 = fire-and-forget (`submitted`).
    query_params: [waitTime]
    # Viya 4 returns synchronous results under `outputs`.
    outputs_key: outputs
    response_fields: [executionState, moduleId, stepId, metadata]

  - id: list_mas_modules
    method: GET
    path: /microanalyticScore/modules
    accept: application/vnd.sas.collection+json
    # Collection-wrapper field the pagination iterator reads.
    response_fields: [items]

  - id: get_mas_module
    method: GET
    path: /microanalyticScore/modules/{module_id}
    accept: application/vnd.sas.microanalytic.module+json
    # Fields the client reads off a single module payload.
    response_fields: [id, name, stepIds]

  - id: create_mas_module
    method: POST
    path: /microanalyticScore/modules
    # Create sends the definition body under a distinct `.definition+json`
    # content type; a plain `.module+json` create body is rejected (415). `scope`
    # is required by the server; `type` is the source-language media type
    # (text/vnd.sas.source.ds2 or text/x-python), not the envelope type.
    content_type: application/vnd.sas.microanalytic.module.definition+json
    request_fields: [id, type, scope, source]
    # Response is the created module rep (same shape as get_mas_module).
    accept: application/vnd.sas.microanalytic.module+json
    response_fields: [id]

  - id: get_mas_module_source
    method: GET
    path: /microanalyticScore/modules/{module_id}/source
    accept: application/vnd.sas.microanalytic.module.source+json
    # Fields the client reads off the source subresource.
    response_fields: [moduleId, source]

  - id: update_mas_module_source
    method: PUT
    path: /microanalyticScore/modules/{module_id}/source
    content_type: application/vnd.sas.microanalytic.module.source+json
    request_fields: [moduleId, type, source]
    accept: application/vnd.sas.microanalytic.module.source+json
    # Optimistic concurrency: the PUT REQUIRES an `If-Match` header carrying the
    # module's current ETag (returned by GET module or GET source); without it
    # the server responds 428 Precondition Required. Documented here as a
    # required header the client must send.
    required_headers: [If-Match]
    response_fields: [moduleId, source]

  - id: delete_mas_module
    method: DELETE
    path: /microanalyticScore/modules/{module_id}
    # Returns 204 No Content (no response body).
    response_fields: []

  - id: get_mas_module_step_signature
    method: GET
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    accept: application/vnd.sas.microanalytic.module.step+json
    # A step's input/output signature; each list entry is a name/type/dim/size.
    response_fields: [id, moduleId, inputs, outputs]

  - id: validate_mas_module_step_inputs
    method: POST
    path: /microanalyticScore/commons/validations/modules/{module_id}/steps/{step_id}
    # Same body as an execute request (an inputs list).
    request_fields: [inputs]
    accept: application/vnd.sas.validation+json
    # HTTP 201; an invalid payload is reported in-body as `valid: false` with a
    # SAS error object rather than a 4xx. Fields the client reads off the result.
    response_fields: [version, valid]

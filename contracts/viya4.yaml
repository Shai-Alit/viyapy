# Declared REST footprint viyapy depends on for SAS Viya 4.
#
# scripts/check_api_drift.py asserts the Viya4Dialect and the recorded fixtures
# still match this contract. If SAS changes an endpoint or response shape, update
# this file together with the dialect code and the tests/fixtures/viya4 payloads
# — the checker fails if they diverge.
generation: viya4
dialect: Viya4Dialect
fixtures: viya4
reference: https://developer.sas.com/rest-apis
model_step_type: application/vnd.sas.decision.step.model

endpoints:
  - id: get_decision_content
    method: GET
    path: /decisions/flows/{decision_id}
    accept: application/vnd.sas.decision+json
    # Fields the client reads off the decision payload (dotted = nested).
    response_fields: [name, flow.steps]

  - id: list_decision_flows
    method: GET
    path: /decisions/flows
    accept: application/vnd.sas.collection+json
    # Each collection item is an application/vnd.sas.summary; these are the
    # fields the client reads off a decision summary.
    response_fields: [items]
    item_fields: [id, name, description, type, createdBy, modifiedBy, creationTimeStamp, modifiedTimeStamp]

  - id: list_decision_revisions
    method: GET
    path: /decisions/flows/{decision_id}/revisions
    accept: application/vnd.sas.collection+json
    # Collection-wrapper field the pagination iterator reads.
    response_fields: [items]
    # Each item is a lightweight revision summary; these are the fields the
    # client reads off it. `checkout` is the checked-out/lock indicator.
    item_fields: [id, majorRevision, minorRevision, description, nodeCount, checkout, workflowDefinitionId, createdBy, modifiedBy, creationTimeStamp, modifiedTimeStamp]

  - id: get_decision_revision
    method: GET
    path: /decisions/flows/{decision_id}/revisions/{revision_id}
    # A full decision AT the given revision — same shape as get_decision_content
    # (has flow.steps), with revision metadata (majorRevision/minorRevision/
    # checkout) additionally present. Parsed by the same parse_decision.
    accept: application/vnd.sas.decision+json
    response_fields: [name, flow.steps, majorRevision, minorRevision, checkout]

  - id: get_decision_code
    method: GET
    path: /decisions/flows/{decision_id}/code
    # The flow's generated DS2 code for its CURRENT revision. Unlike the JSON
    # endpoints, the response is raw text (Content-Type text/vnd.sas.source.ds2),
    # returned verbatim as a string — so there are no response_fields to declare.
    # `accept` is the request Accept header; `response_media_type` records the
    # raw content type the client reads via request_text.
    accept: text/vnd.sas.source.ds2
    response_media_type: text/vnd.sas.source.ds2

  - id: get_decision_revision_code
    method: GET
    path: /decisions/flows/{decision_id}/revisions/{revision_id}/code
    # Same raw-text DS2 code, but AT a specific historical revision.
    accept: text/vnd.sas.source.ds2
    response_media_type: text/vnd.sas.source.ds2

  - id: get_decision_external_artifacts
    method: GET
    path: /decisions/flows/{decision_id}/externalArtifacts
    # The external resources the flow depends on (analytic stores, etc.). This is
    # a collection wrapper, but NOT paginated — every artifact is returned in one
    # response (no rel:next link), so the client materializes the full tuple.
    accept: application/vnd.sas.collection+json
    response_fields: [items]
    # Each item names an artifact with a type-dependent artifactProperties map
    # (kept as a raw dict). These are the fields the client reads off an item.
    item_fields: [name, artifactType, parentURI, artifactProperties]

  - id: get_decision_revision_external_artifacts
    method: GET
    path: /decisions/flows/{decision_id}/revisions/{revision_id}/externalArtifacts
    # Same shape, but AT a specific historical revision.
    accept: application/vnd.sas.collection+json
    response_fields: [items]
    item_fields: [name, artifactType, parentURI, artifactProperties]

  - id: create_decision_flow
    method: POST
    path: /decisions/flows
    # Create sends the authorable subset (name + optional description/flow/
    # signature/properties) under the decision media type for BOTH Content-Type
    # and Accept; the server assigns id/revision numbers and returns the full
    # representation. The flow graph may be passed as a raw dict or composed with
    # the typed FlowBuilder (phase 5.4b); both serialize to the same body.
    content_type: application/vnd.sas.decision+json
    request_fields: [name, description, flow]
    accept: application/vnd.sas.decision+json
    response_fields: [id]

  - id: update_decision_flow
    method: PUT
    path: /decisions/flows/{decision_id}
    content_type: application/vnd.sas.decision+json
    request_fields: [name, description, flow]
    accept: application/vnd.sas.decision+json
    # Optimistic concurrency: the PUT REQUIRES an `If-Match` header carrying the
    # flow's current ETag (returned by GET flow); without it the server responds
    # 428 Precondition Required (a stale ETag responds 412).
    required_headers: [If-Match]
    response_fields: [id]

  - id: delete_decision_flow
    method: DELETE
    path: /decisions/flows/{decision_id}
    # Returns 204 No Content (no response body).
    response_fields: []

  - id: execute_mas_step
    method: POST
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    request_fields: [inputs]
    # Binary inputs/outputs: an input or output object may carry `encoding: "b64"`
    # with a base64 string value (MAS accepts this for `binary`/`any`-typed vars).
    # Correlation metadata is optional: a sibling `metadata` object on the request
    # with snake_case `client_id`/`transaction_id`, which MAS echoes on the
    # response `metadata` (alongside server-added `module_id`/`step_id`). Both are
    # optional, so they stay out of the checked `request_fields` (build_inputs
    # omits them unless supplied).
    # Optional `waitTime` query param (milliseconds) selects the execution mode:
    # omitted = synchronous (executionState `completed`); positive = timed
    # (`completed` or `timedOut`); 0 = fire-and-forget (`submitted`).
    query_params: [waitTime]
    # Viya 4 returns synchronous results under `outputs`.
    outputs_key: outputs
    response_fields: [executionState, moduleId, stepId, metadata]

  - id: list_mas_modules
    method: GET
    path: /microanalyticScore/modules
    accept: application/vnd.sas.collection+json
    # Collection-wrapper field the pagination iterator reads.
    response_fields: [items]

  - id: get_mas_module
    method: GET
    path: /microanalyticScore/modules/{module_id}
    accept: application/vnd.sas.microanalytic.module+json
    # Fields the client reads off a single module payload.
    response_fields: [id, name, stepIds]

  - id: create_mas_module
    method: POST
    path: /microanalyticScore/modules
    # Create sends the definition body under a distinct `.definition+json`
    # content type; a plain `.module+json` create body is rejected (415). `scope`
    # is required by the server; `type` is the source-language media type
    # (text/vnd.sas.source.ds2 or text/x-python), not the envelope type.
    content_type: application/vnd.sas.microanalytic.module.definition+json
    request_fields: [id, type, scope, source]
    # Response is the created module rep (same shape as get_mas_module).
    accept: application/vnd.sas.microanalytic.module+json
    response_fields: [id]

  - id: get_mas_module_source
    method: GET
    path: /microanalyticScore/modules/{module_id}/source
    accept: application/vnd.sas.microanalytic.module.source+json
    # Fields the client reads off the source subresource.
    response_fields: [moduleId, source]

  - id: update_mas_module_source
    method: PUT
    path: /microanalyticScore/modules/{module_id}/source
    content_type: application/vnd.sas.microanalytic.module.source+json
    request_fields: [moduleId, type, source]
    accept: application/vnd.sas.microanalytic.module.source+json
    # Optimistic concurrency: the PUT REQUIRES an `If-Match` header carrying the
    # module's current ETag (returned by GET module or GET source); without it
    # the server responds 428 Precondition Required. Documented here as a
    # required header the client must send.
    required_headers: [If-Match]
    response_fields: [moduleId, source]

  - id: delete_mas_module
    method: DELETE
    path: /microanalyticScore/modules/{module_id}
    # Returns 204 No Content (no response body).
    response_fields: []

  - id: submit_mas_compile_job
    method: POST
    path: /microanalyticScore/jobs
    # A compile job is submitted with the SAME module.definition body as a
    # synchronous create (only the Accept/response envelope differs). The server
    # accepts it 202 and compiles the module asynchronously.
    content_type: application/vnd.sas.microanalytic.module.definition+json
    request_fields: [id, type, scope, source]
    accept: application/vnd.sas.microanalytic.job+json
    # Fields the client reads off the job resource.
    response_fields: [id, moduleId, state]

  - id: get_mas_compile_job
    method: GET
    path: /microanalyticScore/jobs/{job_id}
    accept: application/vnd.sas.microanalytic.job+json
    # The job resource; `state` transitions pending -> (running) -> terminal
    # (completed | failed). A failed job populates `errors` with diagnostics.
    response_fields: [id, moduleId, state, errors]

  - id: get_mas_module_step_signature
    method: GET
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    accept: application/vnd.sas.microanalytic.module.step+json
    # A step's input/output signature; each list entry is a name/type/dim/size.
    response_fields: [id, moduleId, inputs, outputs]

  - id: validate_mas_module_step_inputs
    method: POST
    path: /microanalyticScore/commons/validations/modules/{module_id}/steps/{step_id}
    # Same body as an execute request (an inputs list).
    request_fields: [inputs]
    accept: application/vnd.sas.validation+json
    # HTTP 201; an invalid payload is reported in-body as `valid: false` with a
    # SAS error object rather than a 4xx. Fields the client reads off the result.
    response_fields: [version, valid]

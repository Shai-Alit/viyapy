# Declared REST footprint viyapy depends on for SAS Viya 3.5.
#
# scripts/check_api_drift.py asserts the Viya35Dialect and the recorded fixtures
# still match this contract. Viya 3.5 is a frozen generation, so this should
# rarely change — the value is catching accidental code/fixture edits.
generation: viya35
dialect: Viya35Dialect
fixtures: viya35
reference: https://go.documentation.sas.com/doc/en/calcdc/3.5/calmicroanalyticref/home.htm
model_step_type: application/vnd.sas.decision.step.model

endpoints:
  - id: get_decision_content
    method: GET
    path: /decisions/flows/{decision_id}
    accept: application/vnd.sas.decision+json
    response_fields: [name, flow.steps]

  - id: execute_mas_step
    method: POST
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    request_fields: [inputs]
    # Viya 3.5 returns synchronous results under `output` (singular).
    outputs_key: output
    response_fields: [executionState, moduleId, stepId]

  - id: list_mas_modules
    method: GET
    path: /microanalyticScore/modules
    accept: application/vnd.sas.collection+json
    # Collection-wrapper field the pagination iterator reads.
    response_fields: [items]

  - id: get_mas_module
    method: GET
    path: /microanalyticScore/modules/{module_id}
    accept: application/vnd.sas.microanalytic.module+json
    # Fields the client reads off a single module payload.
    response_fields: [id, name, stepIds]

  - id: get_mas_module_step_signature
    method: GET
    path: /microanalyticScore/modules/{module_id}/steps/{step_id}
    accept: application/vnd.sas.microanalytic.module.step+json
    # A step's input/output signature; each list entry is a name/type/dim/size.
    response_fields: [id, moduleId, inputs, outputs]

  - id: validate_mas_module_step_inputs
    method: POST
    path: /microanalyticScore/commons/validations/modules/{module_id}/steps/{step_id}
    # Same body as an execute request (an inputs list).
    request_fields: [inputs]
    accept: application/vnd.sas.validation+json
    # HTTP 201; an invalid payload is reported in-body as `valid: false` with a
    # SAS error object rather than a 4xx. Fields the client reads off the result.
    response_fields: [version, valid]

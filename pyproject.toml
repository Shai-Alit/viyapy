[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "viyapy"
version = "3.0.0.dev0"
description = "A Python client for SAS Viya Intelligent Decisioning (Decisions + Micro Analytic Score) supporting Viya 3.5 and Viya 4."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sean Ford", email = "psuaerofighter@gmail.com" }]
keywords = ["sas", "viya", "intelligent decisioning", "decisions", "mas", "microanalytic", "scoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # requests only permits urllib3>=2 from 2.30.0 onward.
    "requests>=2.30",
    "urllib3>=2.0",
]

[project.urls]
Homepage = "https://github.com/Shai-Alit/viyapy"
Repository = "https://github.com/Shai-Alit/viyapy"
Issues = "https://github.com/Shai-Alit/viyapy/issues"
Changelog = "https://github.com/Shai-Alit/viyapy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "nox>=2024.4.15",
    "build>=1.2",
    "twine>=5.0",
    "types-requests",
]
docs = [
    # Pin to the MkDocs 1.x line we build against. A separate "MkDocs 2.0" effort
    # (announced Feb 2026) is incompatible with the 1.x plugin/theming API that
    # Material and mkdocstrings use; keep this cap until we deliberately migrate.
    # Ref: https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
drift = [
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "schemathesis>=3.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viyapy"]

[tool.hatch.build.targets.sdist]
include = ["src/viyapy", "README.md", "LICENSE"]

# ----------------------------------------------------------------------------
# Ruff — linting + formatting
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "BLE",       # flake8-blind-except  (no bare/blind except)
    "SIM",       # flake8-simplify
    "C4",        # comprehensions
    "RET",       # return
    "PTH",       # prefer pathlib
    "RUF",       # ruff-specific
    "T20",       # flake8-print  (no print in library code)
    "D",         # pydocstyle    (public API must be documented)
]
# E722 (bare except) is covered by E; BLE001 forbids `except Exception` without re-raise.
ignore = [
    "D105",      # magic-method docstrings not required (dunders)
    "D107",      # __init__ documented via the class docstring, not its own
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and nox: prints allowed; docstrings not required.
"tests/**" = ["T20", "D"]
"noxfile.py" = ["T20", "D"]
# Example scripts are CLI programs: printing to stdout is their purpose.
"examples/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["viyapy"]

# ----------------------------------------------------------------------------
# Mypy — strict typing on the package
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ----------------------------------------------------------------------------
# Pytest + coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage is measured on every run and gated (see [tool.coverage.report]).
# For a fast focused run without the gate, pass --no-cov.
addopts = "-ra --strict-markers --cov=viyapy --cov-report=term-missing"
markers = [
    "integration: opt-in tests that hit a live Viya server (skipped by default)",
]

[tool.coverage.run]
source = ["viyapy"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

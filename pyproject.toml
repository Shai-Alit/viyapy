[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "viyapy"
version = "3.0.0.dev0"
description = "A Python client for SAS Viya Intelligent Decisioning (Decisions + Micro Analytic Score) supporting Viya 3.5 and Viya 4."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sean Ford", email = "psuaerofighter@gmail.com" }]
keywords = ["sas", "viya", "intelligent decisioning", "decisions", "mas", "microanalytic", "scoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # requests only permits urllib3>=2 from 2.30.0 onward.
    "requests>=2.30",
    "urllib3>=2.0",
]

[project.urls]
Homepage = "https://github.com/Shai-Alit/viyapy"
Repository = "https://github.com/Shai-Alit/viyapy"
Issues = "https://github.com/Shai-Alit/viyapy/issues"
Changelog = "https://github.com/Shai-Alit/viyapy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "nox>=2024.4.15",
    "build>=1.2",
    "twine>=5.0",
    "types-requests",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
drift = [
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "schemathesis>=3.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viyapy"]

[tool.hatch.build.targets.sdist]
include = ["src/viyapy", "README.md", "LICENSE"]

# ----------------------------------------------------------------------------
# Ruff — linting + formatting
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "BLE",       # flake8-blind-except  (no bare/blind except)
    "SIM",       # flake8-simplify
    "C4",        # comprehensions
    "RET",       # return
    "PTH",       # prefer pathlib
    "RUF",       # ruff-specific
    "T20",       # flake8-print  (no print in library code)
]
# E722 (bare except) is covered by E; BLE001 forbids `except Exception` without re-raise.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]        # prints allowed in tests
"noxfile.py" = ["T20"]
# Legacy flat module: retained for backward compatibility and wrapped by the
# deprecation shim in slice 1d. Exempt from lint until it is removed in v4.
"src/viyapy/viya_utils.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["viyapy"]

# ----------------------------------------------------------------------------
# Mypy — strict typing on the package
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Legacy flat module is untyped by design; it is replaced by the compat shim
# in slice 1d. Exempt from strict typing until it is removed in v4.
[[tool.mypy.overrides]]
module = ["viyapy.viya_utils"]
ignore_errors = true

# ----------------------------------------------------------------------------
# Pytest + coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: opt-in tests that hit a live Viya server (skipped by default)",
]

[tool.coverage.run]
source = ["viyapy"]
branch = true

[tool.coverage.report]
show_missing = true
# Coverage gate is enforced starting in Phase 2 (target: fail_under = 90).
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

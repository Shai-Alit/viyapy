name: CI

# Lint, type-check, and test on every PR and every push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (a new push to a PR/branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo. No token can write.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.5"
      - name: ruff check
        run: ruff check src tests examples noxfile.py
      - name: ruff format --check
        run: ruff format --check src tests examples noxfile.py

  type:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: mypy
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Widen the boundary Python versions across the other OSes so we catch
        # platform-specific breakage without paying for the full 3x5 grid.
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests with coverage gate
        # pytest addopts already enforce --cov=viyapy; the >=90% floor is set by
        # [tool.coverage.report] fail_under in pyproject.toml, so a coverage
        # regression fails the job here.
        run: pytest

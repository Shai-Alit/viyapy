name: Security

# Supply-chain and secret hygiene: dependency vulnerabilities (pip-audit),
# static security analysis (bandit), committed-secret scanning (gitleaks), and
# an SBOM artifact. Runs on PRs, pushes to main, and weekly to catch newly
# disclosed CVEs in unchanged dependencies.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit the project dependency closure
        # The trailing `.` audits only viyapy's declared dependency tree
        # (resolved in build isolation), not the runner's own packages. To
        # allowlist an unfixable advisory, append `--ignore-vuln <ID>`.
        run: pip-audit --progress-spinner=off .

  bandit:
    name: Static security analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Scan the package for insecure patterns
        # Fail on high-severity findings (per PRODUCTION_PLAN.md §9), filtering
        # low-confidence noise.
        run: bandit -r src --severity-level high --confidence-level medium

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so secrets that were committed and later removed are caught.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Build runtime SBOM
        # Install only the package (runtime closure) into an isolated venv, then
        # describe that environment as CycloneDX.
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          python -m venv .sbomenv
          .sbomenv/bin/pip install --upgrade pip .
          cyclonedx-py environment .sbomenv/bin/python --mc-type library --output-format JSON -o sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error

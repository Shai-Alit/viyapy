name: AI Review (Codex)

# Automated PR review by an Azure AI Foundry model (a gpt-5.1-codex deployment).
# Runs on every same-repo pull request. Skip a run by putting a flag in the head
# commit message ([skip-review], [no-review], or [skip ai-review]) or by adding
# the "no-ai-review" label to the PR. Comment-only: it never blocks a merge.
#
# Security: this is a plain `pull_request` workflow, but it checks out the BASE
# branch — never the PR head — so the reviewer runs the trusted copy of the
# script with the Azure key, and a malicious PR cannot alter the code that sees
# the secret. The PR diff and head commit message are read through the GitHub API
# (see .github/scripts/ai_review.py), so no PR code is ever executed here.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR; cancel an in-flight review when a new commit lands.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: read the code, write PR review comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Codex review
    runs-on: ubuntu-latest
    # Skip drafts, dependabot, opt-out label, and fork PRs (fork PRs get a
    # read-only token and no secrets under `pull_request`, so they can't run).
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review')
    steps:
      # Check out the BASE branch so the reviewer runs trusted code, not the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Codex reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
        run: python .github/scripts/ai_review.py

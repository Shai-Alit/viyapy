name: AI Review (Codex)

# Automated PR review by an Azure AI Foundry model (a gpt-5.1-codex deployment).
# Runs on every pull request. Skip a run by putting a flag in the head commit
# message ([skip-review], [no-review], or [skip ai-review]) or by adding the
# "no-ai-review" label to the PR. Comment-only: it never blocks a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR; cancel an in-flight review when a new commit lands.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: read the code, write PR review comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Codex review
    runs-on: ubuntu-latest
    # Skip drafts, dependabot, and PRs explicitly labelled to opt out.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # need the head commit message for the skip check

      - id: gate
        name: Check for a skip flag in the head commit
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if printf '%s' "$MSG" | grep -qiE '\[(skip[- ]review|no[- ]review|skip ai[- ]?review)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AI review skipped — skip flag found in the head commit message."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Run Codex reviewer
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
        run: python .github/scripts/ai_review.py

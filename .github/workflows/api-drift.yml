name: API Drift

# Two-layer drift detection for viyapy's SAS Viya REST footprint.
#
# `check` is a hard gate: it asserts contracts/, the dialect code, and the
# captured fixtures still agree (scripts/check_api_drift.py). It runs on any PR
# that touches those files, plus on a monthly schedule and on demand.
#
# `remind` is the upstream half: because SAS publishes no machine-diffable specs,
# it opens/refreshes a maintainer issue each month to review new SAS releases by
# hand against the contracts.
on:
  pull_request:
    paths:
      - "src/viyapy/dialects/**"
      - "contracts/**"
      - "supported_viya.yaml"
      - "scripts/check_api_drift.py"
      - "tests/fixtures/**"
      - ".github/workflows/api-drift.yml"
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

concurrency:
  group: api-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Contract ↔ code ↔ fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install package + drift deps
        # The consistency checker only needs PyYAML on top of the package.
        run: python -m pip install --upgrade pip && python -m pip install -e . pyyaml
      - name: Run the drift check
        run: python scripts/check_api_drift.py

  remind:
    name: Upstream review reminder
    # Only the scheduled run nudges a human; PRs just need the gate above.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Open or refresh the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream API review: check latest SAS Viya releases against contracts/"
          BODY_FILE="$(mktemp)"
          {
            echo "Automated monthly reminder from the API-drift workflow."
            echo
            echo "SAS publishes no versioned, machine-diffable OpenAPI specs, so the"
            echo "upstream half of drift detection is manual. Please review the current"
            echo "SAS Viya Decisions + Micro Analytic Score release notes against"
            echo '`contracts/`, then update `last_reviewed` in `supported_viya.yaml`.'
            echo
            echo "Current support matrix:"
            echo '```yaml'
            cat supported_viya.yaml
            echo '```'
          } > "$BODY_FILE"
          EXISTING="$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

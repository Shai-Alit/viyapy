name: Claude Review

# Independent AI review of every PR. Comment-only for now (not a required
# check) so we can tune signal-to-noise before making it blocking.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs when a PR gets new commits.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and Dependabot noise.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The action reaches Microsoft Foundry through Azure OIDC only (no API
      # key). This federates the workflow's GitHub OIDC token into Entra ID; the
      # resulting Azure credential is what Claude Code uses to call the resource.
      # The federated app/identity needs a data-plane role (e.g. Cognitive
      # Services User) on the Foundry resource.
      #
      # We deliberately do NOT pin a subscription: the reviewer only needs a
      # data-plane token for the Cognitive Services (Foundry) endpoint, which is
      # resource-scoped, not subscription-scoped. Passing subscription-id made
      # login fail ("The subscription of '...' doesn't exist in cloud") when the
      # service principal had no subscription-scoped role. allow-no-subscriptions
      # lets the OIDC login succeed and still yields a usable token.
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Pinned to the major tag so we pick up Foundry support (added after
      # v1.0.183). Re-pin to a specific version once verified if you prefer.
      - uses: anthropics/claude-code-action@v1
        env:
          # Foundry resource name (e.g. sefordfoundry) — the action builds the
          # https://<resource>.services.ai.azure.com endpoint from this.
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
          # Claude Code makes background calls to a small/fast model; point it at
          # a deployed Haiku so those resolve (deploy claude-haiku-4-5 too).
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.CLAUDE_FOUNDRY_HAIKU_MODEL }}
        with:
          # Turn on Foundry+OIDC. The action derives CLAUDE_CODE_USE_FOUNDRY from
          # this input; setting the env var directly is ignored.
          use_foundry: "true"
          # TEMPORARY (diagnostic): the action hides the Claude Code SDK output by
          # default ("full output hidden for security") and GitHub debug logging
          # does NOT override it. The reviewer currently returns is_error:true after
          # a flat ~180s timeout on the first model call with no visible reason;
          # this surfaces the real Foundry error. Remove once the root cause is fixed.
          show_full_output: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an independent reviewer for `viyapy`, a Python client library
            for SAS Viya Intelligent Decisioning that must support BOTH Viya 3.5
            and Viya 4 (LTS + Stable). Review this PR as a senior Python library
            maintainer. The design intent is captured in PRODUCTION_PLAN.md — check
            changes against it. The PR branch is already checked out.

            Focus, in priority order:
            - Correctness & error handling: no bare/blind `except`, no `print` in
              library code, no returning None to signal failure, every HTTP call
              has a timeout. Failures should raise typed `ViyaError` subclasses.
            - Public API quality: full type hints (mypy --strict), docstrings on
              public API, no leaking of secrets/tokens in logs or `__repr__`.
            - Viya version handling: 3.5 vs 4 differences belong in the dialect
              layer, not scattered `if version ==` branches; watch for the
              `output` vs `outputs` response-shape pitfall.
            - Tests: new/changed logic has unit tests with mocked HTTP (no network),
              error branches covered; fixtures exist per Viya generation.
            - Security & packaging hygiene; docs/CHANGELOG updated when relevant.

            Be specific and concise. Use inline comments for line-specific issues
            and a single summary comment with an overall assessment. Rate blocking
            issues clearly. Only post GitHub comments — do not submit review text
            as chat messages. If the PR looks good, say so briefly.

          # The review model is set with --model (the action has no `model`
          # input). Use the Foundry deployment name, e.g. claude-sonnet-5.
          claude_args: |
            --model ${{ vars.CLAUDE_FOUNDRY_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

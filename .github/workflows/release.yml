name: Release

# Publish to PyPI when a version tag is pushed. Uses PyPI Trusted Publishing
# (OIDC) — no API token is stored anywhere; PyPI verifies this workflow's
# identity. Configure the trusted publisher on PyPI once (see RELEASING.md).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viyapy
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Fail if the tag and package version disagree
        # The git tag (vX.Y.Z) must match the built version, or we would publish
        # a release under the wrong number.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(ls dist/*.whl | sed -E 's/.*viyapy-([^-]+)-.*/\1/')"
          echo "tag=$TAG built=$PKG"
          test "$TAG" = "$PKG"

      - name: Smoke-install the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import viyapy; print('import OK:', viyapy.__version__)"

      - name: Publish to PyPI (Trusted Publishing)
        # Pinned to a tag because the GitHub API was unavailable to resolve the
        # commit SHA at authoring time; Dependabot (github-actions) will pin it
        # to a SHA on its next run.
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
